<!doctype html>
<html lang="zh-CN" data-at-reader>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>查词交互验证</title>
<style>
  body{margin:0;color:#27333b;background:#faf9f6;font:15px/1.6 system-ui,sans-serif}
  #controls{padding:14px 20px;background:#edf1ec;border-bottom:1px solid #ccd4ca}
  h1{font-size:18px;margin:0 0 6px}label{display:inline-flex;gap:5px;align-items:center;margin-right:14px}
  select,button{font:inherit}#state{white-space:pre-wrap;font:12px/1.4 monospace;margin:8px 0 0}
  main{padding:28px 40px;max-width:900px}at-interaction{display:block;margin:18px 0 35px;font:26px/2.3 serif}
  #blank{height:950px;padding:20px;border:1px dashed #c1c9bd;color:#63705e;user-select:none}
</style>
<header id="controls" data-at-ui>
  <h1>查词交互验证 · 全部使用本地假数据</h1>
  <label>查词窗模式 <select id="mode"><option value="page">页面浮窗</option><option value="independent">独立窗口 / 底部面板</option></select></label>
  <label><input id="phone" type="checkbox">模拟手机 / 平板</label>
  <label><input id="close-after-add" type="checkbox">添加成功后关闭</label>
  <label><input id="swap-mouse" type="checkbox">左右键对调</label>
  <label>Anki 结果 <select id="anki-result"><option value="added">added 添加成功</option><option value="updated">updated 覆盖成功</option><option value="error">error 添加失败</option><option value="duplicate">duplicate 重复词</option></select></label>
  <button id="reset-counts" type="button">清空计数</button>
  <pre id="state" aria-label="交互状态"></pre>
</header>
<main>
  <p data-at-ui>先左击一句或右击整段完成分词。再点分词查词；点划线词或下方空白关闭。已激活例句的左右点击应保持选择和分词计数不变。</p>
  <at-interaction id="paragraph-one">猫が図書館で本を読む。犬は庭で遊ぶ。</at-interaction>
  <at-interaction id="paragraph-two">今日は晴れです。</at-interaction>
  <div id="blank">空白区域：点击这里关闭页面浮窗。底部面板点击面板上方区域关闭。</div>
</main>
<script type="module" src="/interaction.js"></script>
</html>
