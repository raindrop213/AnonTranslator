<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>真实 Chrome 扩展窗口验证</title>
  <style>
    body { max-width: 900px; margin: 32px auto; padding: 0 24px; color: #26332e; background: #f8faf8; font: 16px/1.8 system-ui, sans-serif; }
    header { margin-bottom: 28px; }
    h1 { margin: 0; font-size: 22px; }
    .instructions { font-size: 14px; }
    button { padding: 7px 12px; margin: 4px; cursor: pointer; }
    article { padding: 20px; border: 1px solid #cad2cb; background: #fff; }
    article p { margin: 10px 0 28px; font-size: 22px; line-height: 2; }
    pre { min-height: 120px; padding: 14px; border: 1px solid #cad2cb; background: #fff; font: 13px/1.5 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header data-at-ui>
    <h1>真实 Chrome 扩展窗口验证</h1>
    <div class="instructions">此页没有加载 Reader 或模拟平台。请用已安装扩展激活下面日文，再点击分词打开页面查词窗，绑定后测试往返。</div>
    <div>
      <button id="bind" type="button">绑定已打开的查词窗</button>
      <button id="open-chapter" type="button">从 calibre 式章节打开查词窗</button>
      <button id="roundtrip" type="button">往返一次并检查真实扩展窗口</button>
      <button id="cleanup" type="button">关闭已打开的测试窗口</button>
    </div>
  </header>
  <article>
    <p id="first">猫は図書館で本を読んでいます。今日はとても静かな一日です。</p>
    <p id="second">庭に咲いている花を見ながら、日本語の小説をゆっくり読みます。</p>
  </article>
  <iframe id="chapter" title="calibre-web sandbox 章节" sandbox="allow-same-origin" srcdoc="<!doctype html><meta charset='utf-8'><style>body{font:22px/2 sans-serif;margin:20px}</style><p><span>図書館で本を読みます。</span></p>" style="width:100%;height:160px;border:1px solid #cad2cb"></iframe>
  <pre id="results" data-at-ui role="status">尚未绑定查词窗。</pre>
  <script type="module" src="/native-reader.js"></script>
</body>
</html>
