<!doctype html><meta charset="utf-8"><title>TTsu 模拟阅读页</title>
<style>
body { margin: 0; overflow: hidden; }
.book-content { margin: 32px auto; width: 659px; height: 608px; overflow: hidden; writing-mode: vertical-rl; --book-content-child-height: 608px; --book-content-child-width: 659px; font: 20px/1.6 serif; }
.book-content-container { width: 100%; height: auto; column-width: 608px; column-count: 1; column-gap: 40px; column-fill: auto; }
p { margin: 0 0 1em; }
</style>
<div class="book-content book-content--writing-vertical-rl"><div class="book-content-container">
<p data-first>「<ruby>空<rp>（</rp><rt>そら</rt><rp>）</rp></ruby>を見た。星が光った！」</p>
<p data-second><em data-live>次の朝。</em>旅に出た。</p>
<p data-long></p>
</div></div>
<script>
document.querySelector('[data-long]').textContent = 'これは長い段落の中の文章です。'.repeat(250);
window.fixturePages = [];
let position = 0;
window.addEventListener('keydown', event => {
  if (!['ArrowDown', 'ArrowUp'].includes(event.code)) return;
  window.fixturePages.push(event.code);
  position += event.code === 'ArrowDown' ? 1 : -1;
  document.querySelector('.book-content').scrollTo({ top: position * 648 });
});
</script>
